{% extends "base.html" %}
{% block content %}
<h1>Change password</h1>
<form method="post" class="stack narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Current password <input type="password" name="current" required autocomplete="current-password"></label>
  <label>New password (12+ characters) <input type="password" name="password" required autocomplete="new-password"></label>
  <label>Confirm new password <input type="password" name="confirm" required autocomplete="new-password"></label>
  <button>Change password</button>
</form>
{% endblock %}
